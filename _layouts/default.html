<!doctype html>
<html lang="en" data-bs-theme="auto">  
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Kasturi Shah">
    <meta name="author" content="Kasturi Shah">

    <!-- for maths and equations on website -->
    <script src="https://cdn.mathjax.org/mathjax/latest/MathJax.js?config=TeX-AMS-MML_HTMLorMML" type="text/javascript"></script>

    <title>Kasturi Shah</title>

    <!-- image in tab of browser -->
    <link rel="icon" href="/assets/img/icons8-triple-integral-64.png">
    <meta name="theme-color" content="#712cf9">   

    <style>

   /* ==========================================================================
   Foundational items: margin, padding, font, background colour
   ========================================================================== */
   * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  
  body {
    font-family: Arial;
    line-height: 1.5;
    color: #b8c8c3;
    background-color: #0c0a0a;
    padding: 20px;
  }
  
  /* Centre content and restrict width */
  .container {
    max-width: 800px;
    margin: 0 auto;
    background: #ffffff;
    padding: 40px;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
  }
  
  /* ==========================================================================
     Headings, paragraphs, hovering mouse
     ========================================================================== */
  h1, h2, h3 {
    margin-bottom: 1rem;
    color: #cd94da;
    line-height: 1.2;
  }
  
  h1 { font-size: 2.5rem; margin-top: 0; }
  h2 { font-size: 1.8rem; margin-top: 1.5rem; }
  p { margin-bottom: 1.5rem; }
  
  a {
    color: #d1cc38;
    text-decoration: none;
  }
  
  a:hover {
    text-decoration: underline;
  }
  
  /* ==========================================================================
     Buttons, lists
     ========================================================================== */
  /* Buttons */
  .btn {
    display: inline-block;
    background-color: #0066cc;
    color: #ffffff;
    padding: 10px 20px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 1rem;
  }
  
  .btn:hover {
    background-color: #0052a3;
    text-decoration: none;
  }
  
  /* Lists */
  ul, ol {
    margin-bottom: 1.5rem;
    padding-left: 20px;
  }
  
  li {
    margin-bottom: 0.5rem;
  }
  
/* ==========================================================================
     Navigation bar at top of each page (W3Schools code as starting point)
     ========================================================================== */
/* Background colour */
.topnav {
  background-color: #550d68;
  overflow: hidden;
}

/* Options inside navigation bar */
.topnav a {
  float: left;
  color: #f2f2f2;
  text-align: center;
  padding: 14px 16px;
  text-decoration: none;
  font-size: 24px;
}

/* Hover changes colour */
.topnav a:hover {
  background-color: #ddd;
  color: black;
}

/* Add a color to the active/current link */
.topnav a.active {
  background-color: #6ac6a4;
  color: white;
}

/* Add a color to my name on LHS */
.topnav a.name {
  background-color: #236f53;
  color: white;
}
      
</style>    

</head>
  
<body>

    <!-- Navigation bar headings  -->
    <div class="topnav">
      <a class="name" href="/index.html">Kasturi Shah</a>
      <a href="/core.html">Core</a>
      <a href="/research.html">Research</a>
      <a href="/teaching.html">Teaching</a>
      <a href="/service.html">Service</a>
    </div>

    <!-- content insertion from each .md file  -->
    <div class="col-lg-8 mx-auto p-4 py-md-5">
      <main>
        {{ content }} 
      </main>

      <!-- footer with copyright -->
      <footer class="pt-5 my-5 text-body-secondary border-top">
        &copy; &middot; Kasturi Shah
      </footer>
    </div>
    
    </body>
  
</html>
