<!doctype html>
<html lang="en" data-bs-theme="auto">  
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Kasturi Shah">
    <meta name="author" content="Kasturi Shah">

    <title>Kasturi Shah</title>
    <!-- <link href="styles.css" rel="stylesheet"> -->
    <link href="/assets/css/style.scss" rel="stylesheet">

    <!-- Favicons -->
    <link rel="icon" href="/assets/img/icons8-triple-integral-64.png">
    <meta name="theme-color" content="#712cf9">   

    <style>

      /* ==========================================================================
   Base Styles & Reset
   ========================================================================== */
   * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  
  body {
    font-family: Arial;
    line-height: 1.5;
    color: #b8c8c3;
    background-color: #0c0a0a;
    padding: 20px;
  }
  
  /* Container to center content and restrict width */
  .container {
    max-width: 800px;
    margin: 0 auto;
    background: #ffffff;
    padding: 40px;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
  }
  
  /* ==========================================================================
     Typography
     ========================================================================== */
  h1, h2, h3 {
    margin-bottom: 1rem;
    color: #cd94da;
    line-height: 1.2;
  }
  
  h1 { font-size: 2.5rem; margin-top: 0; }
  h2 { font-size: 1.8rem; margin-top: 1.5rem; }
  p { margin-bottom: 1.5rem; }
  
  a {
    color: #d1cc38;
    text-decoration: none;
  }
  
  a:hover {
    text-decoration: underline;
  }
  
  /* ==========================================================================
     Components
     ========================================================================== */
  /* Buttons */
  .btn {
    display: inline-block;
    background-color: #0066cc;
    color: #ffffff;
    padding: 10px 20px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 1rem;
  }
  
  .btn:hover {
    background-color: #0052a3;
    text-decoration: none;
  }
  
  /* Lists */
  ul, ol {
    margin-bottom: 1.5rem;
    padding-left: 20px;
  }
  
  li {
    margin-bottom: 0.5rem;
  }
  
  /* navigation bar */
/* Add a black background color to the top navigation */
.topnav {
  background-color: rgb(49, 38, 52);
  overflow: hidden;
}

/* Style the links inside the navigation bar */
.topnav a {
  float: left;
  color: #f2f2f2;
  text-align: center;
  padding: 14px 16px;
  text-decoration: none;
  font-size: 17px;
}

/* Change the color of links on hover */
.topnav a:hover {
  background-color: #ddd;
  color: black;
}

/* Add a color to the active/current link */
.topnav a.active {
  background-color: #6ac6a4;
  color: white;
}

/* Add a color to my name */
.topnav a.name {
  background-color: #236f53;
  color: white;
}
      
          </style>    

  </head>
  
  <body>

    <div class="topnav">
      <a class="name">Kasturi Shah</a>
      <a class="active" href="/core.html">Core</a>
      <a href="/research.html">Research</a>
      <a href="/teaching.html">Teaching</a>
      <a href="/service.html">Service</a>
    </div>
    
    <div class="col-lg-8 mx-auto p-4 py-md-5">
      <main>
        {{ content }} 
      </main>

      <footer class="pt-5 my-5 text-body-secondary border-top">
        &copy; &middot; Kasturi Shah
      </footer>
    </div>
    

    </body>
  
</html>
